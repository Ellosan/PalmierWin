name: Windows build
on:
  push:
    branches: [main, work]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish after the Windows build (optional)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: PalmierWin-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/beta.yml
            release/SHA256SUMS.txt
            release/README.txt
            release/PalmierWin-preview.png
          if-no-files-found: error
  release:
    name: Publish Windows release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PalmierWin-Windows-x64
          path: release
      - name: Publish stable or beta release with Windows files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag must match package version: $EXPECTED_TAG"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            CHANNEL_ARGS=(--prerelease)
            LATEST_ARGS=(--prerelease --latest=false)
            RELEASE_LABEL="Beta"
          else
            CHANNEL_ARGS=()
            LATEST_ARGS=(--prerelease=false --latest)
            RELEASE_LABEL="Stable"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [ "$(cat release-state.txt)" != "true" ]; then
              echo "Release $RELEASE_TAG is already published. Leaving its files intact."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${CHANNEL_ARGS[@]}" --title "PalmierWin $RELEASE_TAG — $RELEASE_LABEL" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${LATEST_ARGS[@]}"
